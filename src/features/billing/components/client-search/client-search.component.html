<div class="card shadow-sm border-0 mb-3 client-search-card">
  <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <div class="icon-circle bg-primary-subtle text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <div>
        <h6 class="fw-bold mb-0 text-dark">1. Datos del Cliente y Comprobante</h6>
        <small class="text-muted">Configuración fiscal y condiciones de pago</small>
      </div>
    </div>
    @if (header.clientId) {
      <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 rounded-pill">
        ✓ Cliente Seleccionado
      </span>
    }
  </div>

  <div class="card-body p-3">
    <div class="row g-3">
      <!-- Cliente -->
      <div class="col-md-5">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Cliente <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <select
            class="form-select"
            [(ngModel)]="header.clientId"
            (ngModelChange)="onClientSelected($event)"
          >
            <option [ngValue]="0" disabled>-- Selecciona un cliente --</option>
            @for (c of customers(); track c.id) {
              <option [ngValue]="c.id">
                {{ c.name }} ({{ c.identification || 'Sin RNC' }})
              </option>
            }
          </select>
          @if (header.clientId && header.clientId !== 1) {
            <button class="btn btn-outline-secondary" type="button" (click)="resetClient()" title="Resetear cliente">
              ✕
            </button>
          }
        </div>
        @if (header.rncOrCedula) {
          <small class="text-muted d-block mt-1">
            <strong>RNC / Cédula:</strong> {{ header.rncOrCedula }}
          </small>
        }
      </div>

      <!-- Tipo de Factura (Contado / Crédito) -->
      <div class="col-md-2">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Tipo de Venta
        </label>
        <select
          class="form-select"
          [(ngModel)]="header.billingTypeId"
          (ngModelChange)="emitHeader()"
        >
          <option [ngValue]="1">Contado</option>
          <option [ngValue]="2">Crédito</option>
        </select>
      </div>

      <!-- Comprobante Fiscal (NCF) -->
      <div class="col-md-3">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Comprobante Fiscal (NCF)
        </label>
        <select
          class="form-select"
          [(ngModel)]="header.voucherTypeId"
          (ngModelChange)="emitHeader()"
        >
          <option [ngValue]="1">B02 - Consumidor Final</option>
          <option [ngValue]="2">B01 - Crédito Fiscal</option>
          <option [ngValue]="3">B15 - Gubernamental</option>
          <option [ngValue]="4">B14 - Regímenes Especiales</option>
        </select>
      </div>

      <!-- Almacén -->
      <div class="col-md-2">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Almacén
        </label>
        <select
          class="form-select"
          [(ngModel)]="header.warehouseId"
          (ngModelChange)="emitHeader()"
        >
          <option [ngValue]="1">Almacén Principal</option>
          <option [ngValue]="2">Almacén Secundario</option>
          <option [ngValue]="3">Sucursal Norte</option>
        </select>
      </div>

      <!-- Plazo en días (si es crédito) -->
      @if (header.billingTypeId === 2) {
        <div class="col-md-3">
          <label class="form-label fw-semibold text-secondary small mb-1">
            Plazo de Pago (Días)
          </label>
          <div class="input-group">
            <input
              type="number"
              class="form-control"
              min="1"
              max="180"
              [(ngModel)]="header.paymentTermDays"
              (ngModelChange)="emitHeader()"
              placeholder="30"
            />
            <span class="input-group-text small">días</span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
