<div class="card shadow-sm border-0 mb-3 generic-filters-card">
  <div class="card-body p-3">
    <div class="row g-2 align-items-end">
      <!-- Búsqueda por documento / NCF -->
      <div class="col-md-3">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Documento / NCF
        </label>
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-light text-muted">🔍</span>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="filterValues.documentNumber"
            (ngModelChange)="emitFilters()"
            placeholder="ej. FAC-001 o B01..."
          />
        </div>
      </div>

      <!-- Cliente -->
      <div class="col-md-3">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Cliente
        </label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filterValues.clientId"
          (ngModelChange)="emitFilters()"
        >
          <option [ngValue]="null">-- Todos los clientes --</option>
          @for (c of customers(); track c.id) {
            <option [ngValue]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <!-- Estatus -->
      <div class="col-md-2">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Estatus
        </label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filterValues.statusId"
          (ngModelChange)="emitFilters()"
        >
          <option [ngValue]="null">-- Todos --</option>
          <option [ngValue]="1">Emitida / Cobrada</option>
          <option [ngValue]="2">Pendiente</option>
          <option [ngValue]="3">Anulada</option>
        </select>
      </div>

      <!-- Desde -->
      <div class="col-md-2">
        <label class="form-label fw-semibold text-secondary small mb-1">
          Desde
        </label>
        <input
          type="date"
          class="form-control form-control-sm"
          [(ngModel)]="filterValues.startDate"
          (ngModelChange)="emitFilters()"
        />
      </div>

      <!-- Hasta y Limpiar -->
      <div class="col-md-2 d-flex gap-2">
        <div class="flex-grow-1">
          <label class="form-label fw-semibold text-secondary small mb-1">
            Hasta
          </label>
          <input
            type="date"
            class="form-control form-control-sm"
            [(ngModel)]="filterValues.endDate"
            (ngModelChange)="emitFilters()"
          />
        </div>
        <div class="pt-4">
          <button
            class="btn btn-sm btn-outline-secondary"
            type="button"
            (click)="resetFilters()"
            title="Limpiar filtros"
          >
            ✕
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
