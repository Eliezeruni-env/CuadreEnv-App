@if (visible) {
  <div class="custom-modal-backdrop" (click)="close()">
    <div
      class="custom-modal-content receivable-modal-container"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="custom-modal-header border-0 pb-0">
        <div class="d-flex align-items-center gap-3">
          <div class="modal-header-icon-box">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-primary"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <h5 class="fw-bold mb-0 text-body">Nueva Venta por Cobrar</h5>
        </div>
        <button
          type="button"
          class="btn-close"
          (click)="close()"
          aria-label="Close"
        ></button>
      </div>

      <!-- Body -->
      <div class="custom-modal-body pt-3">
        <form cForm [formGroup]="receivableForm">
          <!-- Top Row: Client & Sale Details (2 Columns) -->
          <div class="row g-3 mb-4">
            <!-- Section 1: Información del cliente -->
            <div class="col-lg-6">
              <div class="form-section p-3 bg-light bg-opacity-50 rounded-3 border h-100">
                <h6 class="section-title d-flex align-items-center gap-2">
                  <span>1. Información del cliente</span>
                </h6>

                <!-- Cliente Search / Select Row -->
                <div class="mb-3">
                  <label class="form-label required-label">Cliente</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="text-muted"
                      >
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                      </svg>
                    </span>
                    <select
                      cSelect
                      formControlName="customerId"
                      class="border-start-0 border-end-0"
                      (change)="onCustomerSelect($event)"
                    >
                      <option value="">Buscar cliente...</option>
                      @for (c of customers(); track c.id) {
                        <option [value]="c.id">
                          {{ c.name }} {{ c.identification ? '(' + c.identification + ')' : '' }}
                        </option>
                      }
                    </select>
                    <button
                      type="button"
                      class="btn btn-outline-secondary px-3"
                      title="Nuevo cliente rápido"
                      (click)="toggleQuickCustomer()"
                    >
                      +
                    </button>
                  </div>
                </div>

                @if (isQuickCustomer()) {
                  <div class="mb-3 p-2 bg-light rounded-3 border">
                    <label class="form-label required-label">Nombre del nuevo cliente</label>
                    <input
                      type="text"
                      cFormControl
                      formControlName="quickCustomerName"
                      placeholder="Ej. Roberto Sánchez"
                    />
                  </div>
                }

                <!-- Phone & Email 2-column -->
                <div class="row g-2">
                  <div class="col-sm-6">
                    <label class="form-label">Teléfono</label>
                    <input
                      type="text"
                      cFormControl
                      formControlName="customerPhone"
                      placeholder="809-000-0000"
                    />
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Correo electrónico</label>
                    <input
                      type="email"
                      cFormControl
                      formControlName="customerEmail"
                      placeholder="cliente@correo.com"
                    />
                  </div>
                </div>
              </div>
            </div>

            <!-- Section 2: Detalles de la venta -->
            <div class="col-lg-6">
              <div class="form-section p-3 bg-light bg-opacity-50 rounded-3 border h-100">
                <h6 class="section-title d-flex align-items-center gap-2">
                  <span>2. Detalles de la venta</span>
                </h6>

                <div class="mb-3">
                  <label class="form-label required-label">Descripción / Concepto</label>
                  <input
                    type="text"
                    cFormControl
                    formControlName="description"
                    placeholder="Ej. Venta de mercadería, servicios, etc."
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label required-label">Monto total de la deuda</label>
                  <div class="input-group">
                    <span class="input-group-text currency-addon fw-bold text-primary">RD$</span>
                    <input
                      type="number"
                      step="0.01"
                      min="0.01"
                      cFormControl
                      class="form-control-lg fw-bold font-monospace"
                      formControlName="totalAmount"
                      placeholder="0.00"
                      (input)="calculateInstallments()"
                    />
                  </div>
                  <small class="text-muted">Monto total a financiar en cuotas</small>
                </div>
              </div>
            </div>
          </div>

          <!-- Section 3: Plan de pago Box -->
          <div class="payment-plan-card mb-3">
            <h6 class="plan-card-title">Plan de pago</h6>

            <!-- Installment Amount & Quantity -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label required-label"
                  >Monto por cuota (fija)</label
                >
                <div class="input-group">
                  <span class="input-group-text currency-addon fw-semibold"
                    >RD$</span
                  >
                  <input
                    type="number"
                    step="0.01"
                    min="0.01"
                    cFormControl
                    formControlName="installmentAmount"
                    placeholder="0.00"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label required-label"
                  >Cantidad de cuotas</label
                >
                <div class="input-group">
                  <input
                    type="number"
                    min="1"
                    cFormControl
                    formControlName="totalInstallments"
                    placeholder="1"
                    (input)="calculateInstallments()"
                  />
                  <span class="input-group-text bg-light text-muted"
                    >Cuotas</span
                  >
                </div>
              </div>
            </div>

            <!-- Start Date & Frequency -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label required-label"
                  >Fecha de inicio del plan</label
                >
                <input
                  type="date"
                  cFormControl
                  formControlName="startDate"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label required-label"
                  >Frecuencia de pago</label
                >
                <select cSelect formControlName="frequency">
                  <option value="Semanal">Semanal</option>
                  <option value="Quincenal">Quincenal</option>
                  <option value="Mensual">Mensual</option>
                  <option value="Diaria">Diaria</option>
                </select>
              </div>
            </div>

            <!-- Info Notice Box -->
            <div class="plan-info-alert">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="info-alert-icon flex-shrink-0"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>
                Se generará un plan de pago con cuotas fijas según la
                frecuencia seleccionada.
              </span>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="custom-modal-footer">
        <button
          cButton
          color="light"
          class="border px-4"
          (click)="close()"
        >
          Cancelar
        </button>
        <button
          cButton
          class="btn-primary-custom px-4"
          [disabled]="isLoading() || receivableForm.invalid"
          (click)="saveReceivable()"
        >
          @if (isLoading()) {
            <c-spinner size="sm" class="me-2"></c-spinner>
            Guardando...
          } @else {
            Guardar Venta
          }
        </button>
      </div>
    </div>
  </div>
}
