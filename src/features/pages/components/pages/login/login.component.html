<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4 shadow-sm border-0">
            <c-card-body>
              <form cForm [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h1 class="fw-bold text-dark">{{ translationService.t('pages.login.title') }}</h1>
                <p class="text-body-secondary mb-4">{{ translationService.t('pages.login.subtitle') }}</p>

                <!-- Global Error Message Banner -->
                @if (errorMessage()) {
                  <c-alert color="danger" class="py-2 mb-4 d-flex align-items-center">
                    <svg cIcon name="cilWarning" class="me-2"></svg>
                    <span>{{ errorMessage() }}</span>
                  </c-alert>
                }

                <!-- Email Input -->
                <div class="mb-3">
                  <c-input-group>
                    <span cInputGroupText>
                      <svg cIcon name="cilEnvelopeOpen"></svg>
                    </span>
                    <input
                      formControlName="email"
                      autoComplete="email"
                      cFormControl
                      [placeholder]="translationService.t('pages.login.email')"
                      [valid]="loginForm.get('email')?.touched ? loginForm.get('email')?.valid : undefined"
                    />
                  </c-input-group>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                  <c-input-group>
                    <span cInputGroupText>
                      <svg cIcon name="cilLockLocked"></svg>
                    </span>
                    <input
                      formControlName="password"
                      autoComplete="current-password"
                      cFormControl
                      [placeholder]="translationService.t('pages.login.password')"
                      type="password"
                      [valid]="loginForm.get('password')?.touched ? loginForm.get('password')?.valid : undefined"
                    />
                  </c-input-group>
                </div>

                <c-row class="align-items-center">
                  <c-col xs="6">
                    <button cButton class="px-4 py-2 w-100 d-flex align-items-center justify-content-center" color="primary" type="submit" [disabled]="isLoading()">
                      @if (isLoading()) {
                        <c-spinner size="sm" class="me-2"></c-spinner>
                        {{ translationService.t('common.loading') }}
                      } @else {
                        {{ translationService.t('pages.login.loginBtn') }}
                      }
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="6">
                    <button cButton class="px-0 text-decoration-none" color="link" type="button">
                      {{ translationService.t('pages.login.forgotPassword') }}
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [style.minWidth.%]="44" class="text-white bg-primary py-5 border-0 shadow-sm d-flex align-items-center justify-content-center">
            <c-card-body class="text-center w-100 px-4">
              <div>
                <h2 class="fw-bold">{{ translationService.t('pages.login.registerPrompt') }}</h2>
                <button [active]="true" cButton class="mt-4 px-4 py-2 btn-light-custom" color="light" routerLink="/register">
                  {{ translationService.t('pages.login.registerBtn') }}
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
