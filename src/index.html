  <meta charset="utf-8">

  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
  <meta content="CuadreEnv" name="description" />
  <meta content="Łukasz Holeczek" name="author" />
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="assets/manifest.webmanifest" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <title>CuadreEnv - POS & Control de Efectivo</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <app-root>
    <div class="fade show" style="text-align: center; padding-top: calc(100vh / 2); height: 100vh">
      <i class="spinner-grow spinner-grow-sm"></i>
      <span class="m-1">Loading...</span>
    </div>
  </app-root>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('assets/sw.js').catch(err => console.warn('SW registration skipped:', err));
      });
    }
  </script>
</body>
